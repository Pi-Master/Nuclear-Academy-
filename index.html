var L=[
{id:"b1",lv:"b",t:"What is nuclear engineering?",body:["Nuclear engineering applies the science of atomic nuclei to useful jobs: generating electricity, making medical isotopes for imaging and cancer treatment, sterilising equipment, and powering some ships and spacecraft.","Nuclear power stations provide roughly a tenth of the world’s electricity. They do it without burning fuel, so they release no carbon dioxide while operating.","<div class='note'>Fact vs model: the uses above are established. Later lessons use simplified models (such as one-group diffusion) that are good for learning but not for real reactor design.</div>"],q:[["Which is a peaceful use of nuclear technology?",["Medical imaging isotopes","Burning coal","Wind turbines"],0,"Radioactive isotopes are widely used in medical diagnosis and treatment."],["Why do operating nuclear plants not emit CO₂ from their fuel?",["They burn it very cleanly","Energy comes from nuclear reactions, not combustion","They use no heat"],1,"Fission releases energy from nuclei; nothing is burned."]],read:"IAEA: Nuclear Power Basics"},
{id:"b2",lv:"b",t:"Atoms and the nucleus",body:["Every atom has a tiny, dense nucleus made of protons (positive) and neutrons (no charge), surrounded by electrons (negative).","The number of protons, the atomic number Z, decides the element. Carbon always has 6 protons. The nucleus is about 100,000 times smaller across than the whole atom, yet holds almost all of its mass.","Analogy: if the atom were a sports stadium, the nucleus would be a pea at the centre."],q:[["What decides which element an atom is?",["Number of neutrons","Number of protons","Number of electrons only"],1,"The proton count (atomic number Z) defines the element."],["Where is most of an atom’s mass?",["In the electrons","In the nucleus","Spread evenly"],1,"Protons and neutrons are about 1,800 times heavier than electrons."]],read:"Try the Atom explorer"},
{id:"b3",lv:"b",t:"Isotopes and radioactivity",body:["Isotopes are atoms of the same element with different numbers of neutrons. Uranium-235 and uranium-238 both have 92 protons but 143 and 146 neutrons.","Some nuclei are unstable and decay, emitting radiation. Alpha particles (2 protons + 2 neutrons) are stopped by paper. Beta particles (fast electrons) are stopped by thin aluminium. Gamma rays are high-energy photons that need dense material such as lead or thick concrete.","Half-life is the time for half of a sample’s nuclei to decay. After 3 half-lives, 1/8 remain."],q:[["Which radiation is stopped by a sheet of paper?",["Alpha","Beta","Gamma"],0,"Alpha particles are heavy and highly ionising, so they stop quickly."],["After 2 half-lives, what fraction remains?",["1/2","1/4","1/8"],1,"½ × ½ = ¼."]],read:"IAEA: Radiation and Radioactivity"},
{id:"i1",lv:"i",t:"Fission and binding energy",body:["In fission, a heavy nucleus such as U-235 absorbs a neutron, becomes unstable and splits into two lighter nuclei, releasing about 200 MeV, plus 2–3 new neutrons.","Why does this release energy? Binding energy per nucleon peaks near iron. Splitting very heavy nuclei moves the products toward that peak, so they are more tightly bound and the difference is released.","If, on average, one of the new neutrons causes another fission, the chain reaction is steady. Reactors are designed to hold exactly this balance."],q:[["Roughly how much energy does one U-235 fission release?",["200 eV","200 keV","200 MeV"],2,"About 200 MeV, millions of times more than a chemical reaction per atom."],["Fusion also releases energy because…",["light nuclei move toward higher binding energy per nucleon","it burns hydrogen","it splits atoms"],0,"Fusing very light nuclei also climbs toward the binding-energy peak."]],read:"Krane, Introductory Nuclear Physics"},
{id:"i2",lv:"i",t:"Mass-energy equivalence",body:["Einstein’s E = mc² says mass and energy are equivalent. The mass of a nucleus is slightly less than the sum of its parts; this mass defect Δm is the binding energy.","<div class='math'>E = Δm · c²\nWorked example: Δm = 1 g = 0.001 kg\nE = 0.001 × (3×10⁸)² = 9×10¹³ J</div>","That is about 25 million kWh from one gram of mass converted. In fission only a small fraction (about 0.1%) of the fuel’s mass is converted, which is still enormous compared with chemical fuel."],q:[["In E = mc², what is c?",["Charge","Speed of light","Heat capacity"],1,"c ≈ 3×10⁸ m/s, the speed of light."],["Binding energy corresponds to…",["extra mass","the mass defect","electron mass"],1,"The nucleus weighs less than its separate nucleons; the difference is the mass defect."]],read:"Lamarsh & Baratta, Intro to Nuclear Engineering"},
{id:"i3",lv:"i",t:"Reactor components",body:["Fuel: uranium oxide pellets in sealed metal tubes (cladding). Moderator: slows neutrons so they are more likely to cause fission (water, heavy water or graphite). Coolant: carries heat away to make steam. Control rods: absorb neutrons to adjust the reaction rate. Containment: a strong outer building that limits release of radioactivity.","Steam spins a turbine connected to a generator, exactly as in a fossil-fuel plant. Only the heat source differs.","<div class='note'>This is a simplified conceptual picture of a light-water reactor. Real designs vary widely.</div>"],q:[["What do control rods do?",["Absorb neutrons","Cool the steam","Hold the fuel"],0,"Inserting rods absorbs neutrons and lowers the fission rate."],["What does a moderator do?",["Slows neutrons","Generates electricity","Absorbs gamma rays only"],0,"Slow (thermal) neutrons are far more likely to cause U-235 fission."]],read:"IAEA: Nuclear Power Reactors in the World"},
{id:"u1",lv:"u",t:"Neutron diffusion and criticality",body:["Beginner view: neutrons wander randomly, drifting from crowded regions to sparse ones, like a drop of ink spreading in water.","Fick’s law: J = −D ∇φ, where J is net neutron current, φ is neutron flux (neutrons per cm² per s), and D is the diffusion coefficient (cm).","The effective multiplication factor k = (neutrons produced) / (neutrons lost by absorption and leakage). k = 1 is critical, k &gt; 1 supercritical, k &lt; 1 subcritical.","<div class='math'>Reactivity ρ = (k − 1) / k\nWorked: k = 1.02 → ρ = 0.02/1.02 = 0.0196\n= about 1,961 pcm (1 pcm = 10⁻⁵)</div>","Computational modelling concept: codes solve the diffusion equation on a mesh for φ, then iterate until k converges (power iteration)."],q:[["If k = 0.98 the reactor is…",["Critical","Subcritical","Supercritical"],1,"k below 1 means the chain reaction is dying away."],["In Fick’s law, D is the…",["decay constant","diffusion coefficient","density"],1,"D (units cm) measures how readily neutrons spread."]],read:"Duderstadt & Hamilton, Nuclear Reactor Analysis"},
{id:"u2",lv:"u",t:"Heat removal in reactor cores",body:["Beginner view: the coolant must carry away heat as fast as fission makes it, like a radiator keeping an engine from overheating.","Energy balance: Q = ṁ c<sub>p</sub> ΔT, where Q is thermal power (W), ṁ is coolant mass flow (kg/s), c<sub>p</sub> is specific heat (J/kg·K) and ΔT is the coolant temperature rise (K).","<div class='math'>Q = 3000 MW, c_p ≈ 5.5 kJ/kg·K, ΔT = 35 K\nṁ = Q / (c_p ΔT) = 3×10⁹ / (5500 × 35)\n≈ 15,600 kg/s</div>","The c<sub>p</sub> value is an approximation for high-pressure water; real designs use detailed property tables."],q:[["If coolant ΔT is doubled for the same power, mass flow needed is…",["Doubled","Halved","Unchanged"],1,"ṁ = Q/(c_p ΔT), so doubling ΔT halves ṁ."],["In Q = ṁ c_p ΔT, what is ṁ?",["Mass flow rate","Moderator ratio","Mean free path"],0,"ṁ is the mass of coolant passing per second."]],read:"Todreas & Kazimi, Nuclear Systems"},
{id:"u3",lv:"u",t:"Reactor safety engineering",body:["Beginner view: safety relies on many independent layers, so that one failure never leads to harm. This is defence in depth.","Physical barriers: the fuel matrix, the cladding, the pressurised primary circuit and the containment building.","Even after shutdown, radioactive decay in the fuel keeps producing heat (decay heat), roughly 6–7% of full power at the moment of shutdown, falling quickly over hours and days. Safety systems must keep cooling the core during this period.","Regulators such as the US NRC, the UK ONR and the IAEA’s safety standards set the requirements designs must meet."],q:[["Defence in depth means…",["One very strong barrier","Multiple independent layers of protection","Burying the reactor"],1,"Several independent barriers and systems back each other up."],["Why is cooling needed after shutdown?",["Decay heat continues","Control rods heat up","The turbine still spins"],0,"Fission products keep decaying and producing heat."]],read:"IAEA Safety Standards Series"}];

l:[[40,190,"Slow neutron","The trigger. Slow (thermal) neutrons are far more likely to be absorbed by U-235.","Thermal neutrons have energies near 0.025 eV; the thermal fission cross-section of U-235 is several hundred barns."],[120,225,"Uranium-235 nucleus","A fissile nucleus. After absorbing a neutron it becomes a very unstable U-236 nucleus that splits.","The liquid-drop model pictures U-236* deforming until electric repulsion overcomes the strong force."],[370,285,"Fission fragments","Two lighter radioactive nuclei, usually of unequal size. Their kinetic energy becomes heat in the fuel.","Typical masses cluster near A ≈ 95 and A ≈ 140."],[560,285,"New neutrons","About 2.4 neutrons are released per fission on average. If one on average causes another fission, the chain continues.","Roughly 0.65% of neutrons are delayed, which gives control systems time to respond."],[300,45,"Energy ≈ 200 MeV","Most energy (about 168 MeV) is the kinetic energy of the fragments, which heats the fuel.","1 kg of fully fissioned U-235 would release about 8×10¹³ J (Chapter 11)."]]},
{id:"pwr",cat:"Nuclear Reactors",t:"Pressurised Water Reactor (PWR), simplified",ls:"i3",d:"Primary loop (red/blue) carries heat from the core to the steam generator. Separate secondary water becomes steam, drives the turbine and generator, is condensed and returns. Simplified: real plants have several loops, a pressuriser and many safety systems.",
s:AR+"<rect x='40' y='70' width='110' height='180' rx='20' class='bx'/><rect x='70' y='150' width='50' height='70' fill='#f59e0b' fill-opacity='.55'/><g stroke='#94a3b8' stroke-width='4'><line x1='80' y1='45' x2='80' y2='150'/><line x1='95' y1='45' x2='95' y2='150'/><line x1='110' y1='45' x2='110' y2='150'/></g><rect x='250' y='60' width='100' height='190' rx='10' class='bx'/><path d='M275 100V200M300 100V200M325 100V200' stroke='#ef4444' stroke-width='2' fill='none'/>"+ar(150,100,250,100,"#ef4444")+ar(250,230,150,230,"#3b82f6")+ci(200,230,11,"#64748b")+ar(350,85,468,85,"#f59e0b")+"<polygon points='470,70 540,50 540,140 470,120' class='bx'/>"+ar(540,95,582,95,"#94a3b8")+"<circle cx='610' cy='95' r='26' class='bx'/>"+tt(610,100,"G","t",1)+ar(505,130,505,198,"#f59e0b")+"<rect x='450' y='200' width='150' height='50' rx='8' class='bx'/>"+ar(450,235,352,235,"#3b82f6")+tt(170,92,"hot","ts")+tt(165,222,"cold","ts")+tt(385,78,"steam","ts")+tt(365,226,"feedwater","ts")+tt(515,170,"exhaust steam","ts"),
l:[[40,285,"Core & vessel","Fuel assemblies sit in the core inside a thick steel pressure vessel. Water flowing through the core carries the fission heat away.","In a PWR the primary water is held at roughly 155 bar so it stays liquid at around 300–330 °C."],[85,25,"Control rods","Neutron-absorbing rods that are inserted or withdrawn to adjust the reaction rate or shut the reactor down.","PWR rods enter from the top. Dissolved boron in the coolant gives slow, long-term reactivity control."],[250,285,"Steam generator","A heat exchanger. Hot primary water flows inside tubes and boils separate, non-radioactive water outside them.","Two separate loops mean the turbine side normally carries no reactor coolant."],[190,308,"Coolant pump","Keeps the primary water circulating around the loop.","Loss of pumping is one of the cases safety analyses must cover."],[470,28,"Turbine","High-pressure steam expands through blades and spins the shaft.","Large plants use high-pressure and several low-pressure turbine stages on one shaft."],[590,28,"Generator","The turbine shaft turns a generator that produces electricity by electromagnetic induction.","A typical large unit is around 1,000 MW electrical, with thermal efficiency near 33%."],[450,285,"Condenser","Turbine exhaust steam is cooled back into water and pumped back to the steam generator.","Waste heat goes to a river, the sea or cooling towers; Carnot’s limit sets the efficiency ceiling."]]},
{id:"shield",cat:"Radiation and Safety",t:"Penetration of alpha, beta and gamma radiation",ch:"ch5",ls:"b3",d:"A conceptual comparison. Alpha is stopped by paper, beta by a few millimetres of aluminium, and gamma is reduced (not eliminated) by thick dense material.",
s:AR+"<rect x='25' y='135' width='50' height='70' rx='6' class='bx'/>"+tt(50,175,"source","ts",1)+ar(75,150,196,150,"#ef4444")+ar(75,165,396,165,"#f59e0b")+ar(75,180,550,180,"#22d3ee")+"<line x1='590' y1='180' x2='660' y2='180' stroke='#22d3ee' stroke-width='2' stroke-dasharray='4 4' marker-end='url(#ar)'/><rect x='200' y='95' width='4' height='130' fill='#94a3b8'/><rect x='400' y='95' width='10' height='130' fill='#94a3b8'/><rect x='555' y='95' width='30' height='130' fill='#475569'/>",
l:[[110,120,"Alpha","Alpha particles are heavy with +2 charge. A sheet of paper or the outer layer of skin stops them.","Alpha emitters are mainly a hazard if inhaled or swallowed."],[290,120,"Beta","Beta particles are fast electrons. A few millimetres of aluminium stops them.","Low-density shielding is preferred for beta because dense metals produce X-rays (bremsstrahlung)."],[450,120,"Gamma","Gamma rays are high-energy photons and the most penetrating of the three.","I = I₀e^(−μx), where μ is the attenuation coefficient: shielding reduces intensity but never reaches exactly zero."],[190,250,"Paper","A thin barrier that stops alpha.","Alpha range in air is only a few centimetres."],[380,250,"Aluminium","A few millimetres stops beta.","Beta range depends on its energy."],[540,285,"Lead / concrete","A thick, dense barrier reduces gamma strongly.","Each half-value layer halves the intensity."]]}];

{id:"ch5",part:"Part 1 – Foundations of Nuclear Science",n:5,t:"Radioactivity",ls:"b3",dg:["shield"],gl:["Half-life","Isotope"],r:"Krane, <i>Introductory Nuclear Physics</i>; Lamarsh & Baratta, <i>Introduction to Nuclear Engineering</i>; IAEA educational material on radiation and radioactivity.",s:"Unstable nuclei decay at random, but large samples follow an exponential law described by the decay constant λ. The half-life T½ = ln 2 / λ is a fixed property of each isotope, and activity is measured in becquerels.",b:["<h3>5.1 Why some nuclei decay</h3>","Most atoms around us never change. A few have nuclei that are unstable: the mix of protons and neutrons cannot stay as it is, and sooner or later the nucleus rearranges itself and emits radiation. This is radioactive decay. It happens spontaneously, and heating or chemical reactions do not change its rate in any meaningful way.","<b>Definition.</b> Activity is the number of decays per second. Its SI unit is the becquerel (Bq): 1 Bq = 1 decay per second.","<h3>5.2 The decay law</h3>","Decay is random for any single nucleus, but a large sample behaves predictably. Each nucleus has the same small chance per second of decaying, called the decay constant λ. The result is exponential decay:","<div class='math'>N(t) = N₀ e^(−λt)\nA(t) = λ N(t)\nT½ = ln 2 / λ ≈ 0.693 / λ</div>","Here N is the number of undecayed nuclei at time t (a pure number), N₀ is the starting number, λ is the decay constant (s⁻¹ or d⁻¹), A is the activity (Bq), and T½ is the half-life, the time for half the nuclei to decay (same time unit as 1/λ).","<h3>5.3 Worked example: iodine-131</h3>","Iodine-131, used in thyroid medicine, has a half-life of 8.02 days. A sample starts at 100 MBq. What is its activity after 24 days?","<div class='math'>λ = 0.693 / 8.02 d = 0.0864 d⁻¹\nA = 100 × e^(−0.0864 × 24) = 100 × e^(−2.07)\nA ≈ 12.6 MBq</div>","Physically, 24 days is almost exactly three half-lives (3 × 8.02 = 24.06 days), so the activity has fallen by a factor of about eight. Short-lived isotopes are attractive in medicine because they do their job and then largely disappear.","<h3>5.4 Real-world engineering</h3>","In reactors, fission products such as iodine-131 and caesium-137 are radioactive, and their decay is the source of decay heat after shutdown. Spent-fuel handling and waste management are planned around half-lives, from about 8 days for iodine-131 to about 30 years for caesium-137.","<div class='note'><b>Key concept:</b> decay is random for each nucleus but predictable for a large sample; the half-life does not depend on how much material there is.</div>"]},
{id:"ch10",part:"Part 2 – Nuclear Physics",n:10,t:"Einstein’s Mass-Energy Equation",ls:"i2",dg:["fission"],gl:["Binding energy","Mass defect"],r:"Krane, <i>Introductory Nuclear Physics</i>; Lamarsh & Baratta, <i>Introduction to Nuclear Engineering</i>; World Nuclear Association information library.",s:"Mass and energy are equivalent, E = mc². Nuclei weigh slightly less than their separated nucleons; this mass defect, converted with 1 u = 931.5 MeV/c², is the binding energy. Binding energy per nucleon peaks near iron and nickel, which explains why both fission and fusion release energy.",b:["<h3>10.1 Mass is a form of energy</h3>","In everyday life mass and energy seem like separate things. Einstein’s relation says they are two sides of one quantity: a system’s rest energy equals its mass times the speed of light squared. Because c² is enormous, a tiny amount of mass corresponds to a large amount of energy.","<div class='math'>E = m c²</div>","E is energy in joules (J), m is mass in kilograms (kg), and c ≈ 2.998×10⁸ m/s is the speed of light. As a check, 1 g (0.001 kg) corresponds to 0.001 × (3×10⁸)² ≈ 9×10¹³ J.","<h3>10.2 A unit made for the nucleus</h3>","Nuclear masses are given in atomic mass units (u), where 1 u = 1.6605×10⁻²⁷ kg, and energies in mega-electron-volts (MeV). Combining E = mc² with these units gives a handy conversion: a mass of 1 u corresponds to 931.5 MeV.","<h3>10.3 Worked example: the deuteron</h3>","The deuteron (one proton plus one neutron) weighs less than its free parts. Using atomic masses, so that the electron masses cancel: the hydrogen-1 atom is 1.007825 u, a neutron is 1.008665 u, and the deuterium atom is 2.014102 u.","<div class='math'>Δm = 1.007825 + 1.008665 − 2.014102 = 0.002388 u\nE_B = 0.002388 u × 931.5 MeV/u ≈ 2.22 MeV</div>","Physically, 2.22 MeV is the energy needed to pull a deuteron apart, and equally the energy released when a proton and a neutron combine. Typical chemical bonds are a few eV, so nuclear processes are roughly a million times more energetic per atom.","<h3>10.4 Binding energy per nucleon</h3>","Dividing the binding energy by the number of nucleons A gives the average energy holding each nucleon in. It rises steeply for light nuclei, peaks near iron-56 and nickel-62 at about 8.8 MeV per nucleon, then declines slowly for heavy nuclei. Moving toward that peak releases energy: heavy nuclei by splitting (fission), light nuclei by joining (fusion)."]},
{id:"ch11",part:"Part 2 – Nuclear Physics",n:11,t:"Nuclear Fission",ls:"i1",dg:["fission"],gl:["Fission","Chain reaction"],r:"Lamarsh & Baratta, <i>Introduction to Nuclear Engineering</i>; Duderstadt & Hamilton, <i>Nuclear Reactor Analysis</i>; World Nuclear Association information library.",s:"Fission splits a heavy nucleus after neutron absorption, releasing about 200 MeV and about 2.4 neutrons. A steady chain reaction needs a multiplication factor k of 1; delayed neutrons make real reactors controllable.",b:["<h3>11.1 What happens in a fission</h3>","Some very heavy nuclei can split in two. Uranium-235 does so readily after absorbing a slow neutron. The resulting uranium-236 nucleus is excited and deforms, then splits into two fission fragments, typically of unequal size, plus on average about 2.4 prompt neutrons and gamma rays. The fragments are radioactive fission products.","Nuclei that fission with slow neutrons, such as U-235, are called fissile. Uranium-238 is fertile: it mostly captures neutrons and, after radioactive decays, becomes plutonium-239, which is fissile. This is why used fuel contains some plutonium.","<h3>11.2 Where the energy goes</h3>","A single fission releases about 200 MeV. Most of it, roughly 168 MeV, is the kinetic energy of the fragments, which turns into heat as they stop inside the fuel. The rest is carried by neutrons and gamma rays and released later by decay of fission products. The energy released if all the nuclei in 1 kg of U-235 fissioned is:","<div class='math'>E = (m / M) · N_A · E_f\n= (1000 g / 235 g/mol) × 6.022×10²³ mol⁻¹ × 200 MeV × 1.602×10⁻¹³ J/MeV\n≈ 8.2×10¹³ J</div>","Here m is the mass (g), M the molar mass (g/mol), N_A is Avogadro’s number (mol⁻¹), E_f is the energy per fission (MeV), and 1.602×10⁻¹³ J/MeV converts to joules. This is about the heat from burning 2,700 tonnes of coal (at roughly 30 MJ/kg). Real fuel burns only a few percent of its uranium, but the comparison shows why nuclear fuel is so energy-dense.","<h3>11.3 The chain reaction</h3>","Each fission releases neutrons. If on average exactly one of them causes another fission, the reaction is self-sustaining. The average number of fissions caused per fission in the previous generation is the multiplication factor k, and reactors operate at k = 1. About 0.65% of neutrons are delayed, emitted seconds after fission by fission products; this stretches the effective reaction time and makes control practical.","<div class='note'><b>Simplified model:</b> this chapter treats k as one number. Real reactor physics (Chapter 19) accounts for neutron energy, geometry and fuel changes over time.</div>"]}];
